<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Circular Emblem -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#1b5e20" stroke-width="4"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <!-- Minaret & Arch Motif -->
  <path d="M 70 120 L 70 85 Q 100 50 130 85 L 130 120 Z" fill="none" stroke="#1b5e20" stroke-width="4"/>
  <!-- Minaret Tower in Center -->
  <rect x="96" y="55" width="8" height="65" fill="#1b5e20"/>
  <polygon points="100,38 93,55 107,55" fill="#1b5e20"/>
  <!-- Crescent -->
  <circle cx="100" cy="32" r="5" fill="#1b5e20"/>
  <!-- Bottom Text -->
  <text x="100" y="145" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="8.5" 
        font-weight="800" 
        fill="#1b5e20" 
        text-anchor="middle" 
        letter-spacing="0.5">JAMIA NADWIYA</text>
  <text x="100" y="158" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-size="7.5" 
        font-weight="700" 
        fill="#2e7d32" 
        text-anchor="middle" 
        letter-spacing="1">EDAVANNA</text>
</svg>
